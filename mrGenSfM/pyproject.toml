[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrGenSfM"
version = "1.0.0"
description = "Single-Node Generative Structure-from-Motion (GenSfM) & Multi-LLM Sparse 3D Reconstruction Plugin for AliceVision Meshroom"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "MeshroomHub & mrGenSfM Contributors" }
]
keywords = ["meshroom", "alicevision", "gensfm", "sfm", "3d-reconstruction", "gaussian-splatting", "diffusion"]
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    "trimesh>=4.0.0",
]
cloud = [
    "google-genai>=2.25.0",
    "httpx>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meshroom*", "gensfm_core*", "scripts*"]

[tool.meshroom.plugin]
name = "mrGenSfM"
version = "1.0.0"
publisher = "Meshroom Community"
requirements = "Cloud API (Any OS/Laptop) or NVIDIA GPU with WSL2/Docker/CUDA 12.0+ for Local mode"
license = "MPL-2.0"
category = "Sparse Reconstruction / AI"
nodes = ["meshroom.genSfm.GenSfM"]
templates = ["meshroom/genSfm.mg"]

[tool.meshroom.plugin.env]
ATTN_BACKEND = "sdpa"
ATTN_BACKEND_WITH_ATTN_BIAS = "sdpa"
SPCONV_ALGO = "native"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

[tool.meshroom.environment]
ATTN_BACKEND = "sdpa"
ATTN_BACKEND_WITH_ATTN_BIAS = "sdpa"
SPCONV_ALGO = "native"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
